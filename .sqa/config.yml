        container: qc.sty_blurry-lemon-dormouse
      gitlab.com/dtgeo.wp5dtc1/dtc51 jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.cloudy-xanthic-rhinoceros.sh
        container: qc.sty_gimpy-turquoise-audemer
  QC.Uni:
