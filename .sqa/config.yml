config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    gitlab.com/dtgeo.wp5dtc1/dtc51:
      branch: ST510107
      repo: https://gitlab.com/dtgeo.wp5dtc1/dtc51.git
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      gitlab.com/dtgeo.wp5dtc1/dtc51 git:
        commands:
        - /usr/bin/env sh .sqa/script.lousy-bronze-avocet.sh
        container: qc.acc_snazzy-lilac-ostrich
  QC.Doc:
    repos:
      gitlab.com/dtgeo.wp5dtc1/dtc51 find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.surly-orchid-uguisu.sh
        container: qc.doc_squeaky-xanthic-panda
      gitlab.com/dtgeo.wp5dtc1/dtc51 git:
        commands:
        - /usr/bin/env sh .sqa/script.queasy-yellow-mole.sh
        container: qc.doc_zippy-goldenrod-coyote
  QC.Lic:
    repos:
      gitlab.com/dtgeo.wp5dtc1/dtc51 licensee:
        commands:
        - /usr/bin/env sh .sqa/script.foggy-teal-heron.sh
        container: qc.lic_seedy-peach-indri
  QC.Sec:
    repos:
      gitlab.com/dtgeo.wp5dtc1/dtc51 bandit:
        commands:
        - /usr/bin/env sh .sqa/script.flabby-tangerine-dragonfly.sh
        container: qc.sec_leaky-linen-markhor
  QC.Sty:
    repos:
      gitlab.com/dtgeo.wp5dtc1/dtc51 flake8:
        commands:
        - /usr/bin/env sh .sqa/script.stealthy-razzmatazz-numbat.sh
        container: qc.sty_paltry-khaki-goose
      gitlab.com/dtgeo.wp5dtc1/dtc51 jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.thirsty-firebrick-cow.sh
        container: qc.sty_scanty-harlequin-clam
  QC.Uni:
    repos:
      gitlab.com/dtgeo.wp5dtc1/dtc51 pytest:
        commands:
        - /usr/bin/env sh .sqa/script.thirsty-tomato-corgi.sh
        container: qc.uni_hazy-asparagus-peccary
  QC.Ver:
    repos:
      gitlab.com/dtgeo.wp5dtc1/dtc51 get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.snazzy-beige-numbat.sh
        container: qc.ver_stealthy-magnolia-heron
timeout: 5400
