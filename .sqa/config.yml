        - /usr/bin/env sh .sqa/script.beady-cerulean-jackal.sh
        container: qc.acc_thirsty-xanthic-chameleon
  QC.Doc:
    repos:
      gitlab.com/dtgeo.wp5dtc1/dtc51 find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.cozy-copper-owl.sh
        container: qc.doc_sickly-lilac-millipede
      gitlab.com/dtgeo.wp5dtc1/dtc51 git:
        commands:
        - /usr/bin/env sh .sqa/script.gamy-sepia-abyssinian.sh
        container: qc.doc_tacky-green-seal
      gitlab.com/dtgeo.wp5dtc1/dtc51 markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.foggy-ivory-spider.sh
        container: qc.doc_greasy-myrtle-fly
  QC.Lic:
